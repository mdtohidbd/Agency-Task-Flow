<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Navigation Drawer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "warning": "#D98C2B",
                      "surface-variant": "#e5e2e1",
                      "on-error-container": "#93000a",
                      "surface-container": "#F5F4F1",
                      "primary-container": "#2f5edb",
                      "on-surface": "#1c1b1b",
                      "outline": "#E3E1DB",
                      "surface-container-high": "#eae7e7",
                      "surface-dim": "#dcd9d9",
                      "tertiary-container": "#b04700",
                      "on-secondary-container": "#636360",
                      "danger": "#C94F4F",
                      "background": "#FFFFFF",
                      "on-background": "#1c1b1b",
                      "on-primary-fixed": "#00164d",
                      "on-tertiary-container": "#ffe1d5",
                      "secondary-container": "#e1dfdc",
                      "primary": "#0044c1",
                      "secondary-fixed-dim": "#c7c6c3",
                      "on-primary": "#ffffff",
                      "secondary": "#5e5e5c",
                      "inverse-on-surface": "#f3f0ef",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "secondary-fixed": "#e4e2de",
                      "inverse-primary": "#b5c4ff",
                      "surface-container-highest": "#e5e2e1",
                      "tertiary-fixed-dim": "#ffb694",
                      "primary-fixed-dim": "#b5c4ff",
                      "on-primary-fixed-variant": "#003cad",
                      "on-primary-container": "#e2e6ff",
                      "error": "#ba1a1a",
                      "surface-tint": "#2154d1",
                      "surface-container-low": "#f6f3f2",
                      "outline-variant": "#c3c5d6",
                      "success": "#3E9C5B",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed-variant": "#7b2f00",
                      "on-secondary": "#ffffff",
                      "on-secondary-fixed-variant": "#464744",
                      "outline-strong": "#C9C7BF",
                      "surface": "#fcf9f8",
                      "on-surface-variant": "#434654",
                      "inverse-surface": "#313030",
                      "on-secondary-fixed": "#1b1c1a",
                      "tertiary-fixed": "#ffdbcc",
                      "ink-blue-container": "#EAEEFC",
                      "tertiary": "#893600",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed": "#351000",
                      "primary-fixed": "#dce1ff",
                      "surface-bright": "#fcf9f8"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "8px",
                      "unit": "4px",
                      "xl": "32px",
                      "margin-desktop": "32px",
                      "lg": "24px",
                      "margin-mobile": "20px",
                      "md": "16px",
                      "gutter": "1px"
              },
              "fontFamily": {
                      "headline-md": [
                              "Patrick Hand"
                      ],
                      "label-sm": [
                              "Patrick Hand"
                      ],
                      "headline-lg": [
                              "Patrick Hand"
                      ],
                      "body-md": [
                              "Patrick Hand"
                      ],
                      "body-lg": [
                              "Patrick Hand"
                      ]
              },
              "fontSize": {
                      "headline-md": [
                              "20px",
                              {
                                      "lineHeight": "26px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-sm": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.01em",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "26px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            font-family: 'Patrick Hand', cursive;
        }
      </style>
</head>
<body class="bg-background text-on-surface h-screen w-full overflow-hidden flex relative font-body-lg text-body-lg">
<!-- Blurred Background Content (Simulated 'My Tasks') -->
<div class="absolute inset-0 z-0 bg-surface flex flex-col blur-sm opacity-50 pointer-events-none">
<!-- TopAppBar (from JSON) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-surface border-b border-outline">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-primary font-headline-md">M</div>
<h1 class="font-headline-md text-headline-md text-primary">Today's Tasks</h1>
</div>
<span class="material-symbols-outlined text-secondary" data-icon="search">search</span>
</header>
<main class="flex-1 p-margin-mobile space-y-md">
<!-- Simulated Tasks -->
<div class="flex items-center gap-md py-sm border-b border-outline">
<div class="w-[3px] h-full bg-primary absolute left-0"></div>
<div class="w-5 h-5 rounded border border-outline flex items-center justify-center"></div>
<span class="flex-1">Review design system updates</span>
</div>
<div class="flex items-center gap-md py-sm border-b border-outline relative">
<div class="w-[3px] h-full bg-warning absolute left-0 top-0 bottom-0"></div>
<div class="w-5 h-5 rounded border border-outline flex items-center justify-center"></div>
<span class="flex-1">Wireframe new dashboard</span>
</div>
</main>
<!-- BottomNavBar (from JSON) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-margin-mobile bg-surface-container border-t border-outline">
<div class="flex flex-col items-center justify-center bg-ink-blue-container text-primary rounded-full px-4 py-1">
<span class="material-symbols-outlined" data-icon="task_alt" style="font-variation-settings: 'FILL' 1;">task_alt</span>
<span class="font-label-sm text-label-sm">My Tasks</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary px-4 py-1">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-sm text-label-sm">Team Board</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary px-4 py-1">
<span class="material-symbols-outlined" data-icon="folder">folder</span>
<span class="font-label-sm text-label-sm">Projects</span>
</div>
</nav>
</div>
<!-- Scrim overlay -->
<div class="absolute inset-0 z-10 bg-on-surface/10 transition-opacity"></div>
<!-- Navigation Drawer -->
<aside class="absolute left-0 top-0 bottom-0 w-3/4 max-w-[320px] bg-background z-20 shadow-[2px_0_8px_rgba(0,0,0,0.06)] border-r border-outline flex flex-col h-full transform transition-transform duration-300 ease-in-out">
<!-- Top Section: Profile -->
<div class="p-margin-mobile pt-[40px] flex flex-col gap-md border-b border-outline">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-primary font-headline-lg text-headline-lg">
                M
            </div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Mahim</h2>
<p class="font-label-sm text-label-sm text-secondary">Senior Designer</p>
</div>
</div>
<!-- Navigation List -->
<nav class="flex-1 overflow-y-auto py-md">
<ul class="flex flex-col">
<li class="">
<a class="flex items-center gap-md px-margin-mobile py-md hover:bg-surface-variant transition-colors text-primary bg-ink-blue-container/30" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-body-lg text-body-lg">Profile Options</span>
</a>
</li>
<li class="">
<a class="flex items-center gap-md px-margin-mobile py-md hover:bg-surface-variant transition-colors text-secondary" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-body-lg text-body-lg">Settings</span>
</a>
</li>


</ul>
</nav>
<!-- Bottom Section: Logout -->
<div class="p-margin-mobile border-t border-outline">
<button class="w-full flex items-center justify-center gap-sm py-sm text-primary font-body-lg text-body-lg rounded-full border border-outline hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                Logout
            </button>
</div>
</aside>


</body></html>
