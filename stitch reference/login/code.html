<style>
        .login-expand {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }
        .login-expand.active {
            max-height: 200px;
            opacity: 1;
        }
    </style>

    }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<div class="w-full max-w-[600px] flex flex-col px-margin-mobile pt-margin-desktop pb-margin-desktop min-h-screen">
<header class="w-full mb-xl pb-md border-b border-outline">
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center">AgencySync</h1>
</header>
<main class="flex-1 flex flex-col justify-center items-center w-full">
<div class="grid grid-cols-2 gap-lg w-full max-w-[400px]">
<!-- Mahim Tile -->
<div class="flex flex-col items-center group">
<button class="w-24 h-24 rounded-full bg-ink-blue-container flex items-center justify-center text-primary font-headline-lg text-headline-lg mb-sm transition-colors duration-200 hover:bg-primary-fixed" onclick="toggleLogin('login-mahim')">
                        M
                    </button>
<span class="font-body-lg text-body-lg text-on-surface">Mahim</span>
<div class="login-expand w-full mt-md" id="login-mahim">
<div class="flex flex-col gap-md border-t border-outline pt-sm">
<div class="relative">
<label class="absolute -top-3 left-0 font-label-sm text-label-sm text-secondary bg-background px-1">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline focus:ring-0 focus:border-primary font-body-lg text-body-lg py-1 px-0" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-2 font-label-sm text-label-sm transition-colors hover:bg-surface-tint">Log In</button>
</div>
</div>
</div>
<!-- Touhidul Tile -->
<div class="flex flex-col items-center group">
<button class="w-24 h-24 rounded-full bg-ink-blue-container flex items-center justify-center text-primary font-headline-lg text-headline-lg mb-sm transition-colors duration-200 hover:bg-primary-fixed" onclick="toggleLogin('login-touhidul')">
                        T
                    </button>
<span class="font-body-lg text-body-lg text-on-surface">Touhidul</span>
<div class="login-expand w-full mt-md" id="login-touhidul">
<div class="flex flex-col gap-md border-t border-outline pt-sm">
<div class="relative">
<label class="absolute -top-3 left-0 font-label-sm text-label-sm text-secondary bg-background px-1">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline focus:ring-0 focus:border-primary font-body-lg text-body-lg py-1 px-0" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-2 font-label-sm text-label-sm transition-colors hover:bg-surface-tint">Log In</button>
</div>
</div>
</div>
<!-- Add Tile -->
<div class="flex flex-col items-center group col-span-2 mt-md justify-center">
<button class="w-16 h-16 rounded-full border border-outline border-dashed flex items-center justify-center text-secondary mb-sm transition-colors duration-200 hover:border-outline-strong hover:text-on-surface">
<span class="material-symbols-outlined">add</span>
</button>
<span class="font-body-md text-body-md text-secondary">Add Teammate</span>
</div>
</div>
</main>
</div>
<script>
        function toggleLogin(id) {
            const elements = document.querySelectorAll('.login-expand');
            elements.forEach(el => {
                if (el.id === id) {
                    el.classList.toggle('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }
    </script>
