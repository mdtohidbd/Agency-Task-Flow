<!-- Interactive script for simple UI feedback -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple checkbox interaction logic
            const checkboxes = document.querySelectorAll('button[aria-label="Mark task complete"]');
            
            checkboxes.forEach(btn => {
                btn.addEventListener('click', function() {
                    const row = this.closest('.group');
                    const text = row.querySelector('.text-on-surface');
                    
                    if (this.innerHTML.trim() === '') {
                        // Mark complete
                        this.innerHTML = `<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">check</span>`;
                        this.classList.add('bg-surface-container');
                        row.classList.add('opacity-50');
                        if(text) {
                            text.classList.add('line-through', 'decoration-outline-strong');
                        }
                    } else {
                        // Unmark complete
                        this.innerHTML = '';
                        this.classList.remove('bg-surface-container');
                        row.classList.remove('opacity-50');
                        if(text) {
                            text.classList.remove('line-through', 'decoration-outline-strong');
                        }
                    }
                });
            });
        });
    </script>
