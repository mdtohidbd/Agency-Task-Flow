<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            background-color: theme('colors.background');
        }
        /* Handwritten feel adjustments */
        input:focus {
            outline: none;
            border-color: theme('colors.primary');
        }
        
        /* Hide scrollbar for a cleaner notepad look, optional */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.outline');
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.secondary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-lg h-full flex flex-col items-center">
<div class="w-full max-w-[600px] bg-background min-h-screen relative shadow-none flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 border-b border-outline dark:border-outline-strong flex justify-between items-center w-full px-margin-mobile h-16 shrink-0 z-10 transition-colors duration-200">
<div class="flex items-center gap-sm">
<!-- Avatar -->
<div class="w-8 h-8 rounded-full border border-outline flex items-center justify-center bg-surface-container text-primary font-headline-md text-headline-md">
                    M
                </div>
</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-inverse-primary font-bold tracking-tight">Settings</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant dark:hover:bg-on-surface-variant text-primary dark:text-inverse-primary transition-colors duration-200">
<span class="material-symbols-outlined">search</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full px-margin-mobile py-lg pb-32 flex flex-col gap-lg">
<!-- Section: Profile Info (Minimal) -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Account</h2>
<div class="flex flex-col border-b border-outline py-unit relative">
<div class="absolute left-0 top-0 bottom-0 w-[3px] bg-primary rounded-l-sm"></div>
<label class="font-label-sm text-label-sm text-secondary pl-sm block">Name</label>
<input class="bg-transparent border-none font-body-lg text-on-background w-full py-1 pl-sm focus:ring-0" placeholder="Your Name" type="text" value="Mark Designer"/>
</div>
<div class="flex flex-col border-b border-outline py-unit">
<label class="font-label-sm text-label-sm text-secondary block">Email</label>
<input class="bg-transparent border-none font-body-lg text-on-background w-full py-1 focus:ring-0" placeholder="you@domain.com" type="email" value="mark@agencysync.co"/>
</div>
</section>
<!-- Divider (Notepad Hairline) -->
<hr class="border-t border-outline my-sm w-full"/>
<!-- Section: Theme Preference -->
<section class="flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Theme Preference</h2>
<div class="flex gap-md">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative w-5 h-5 rounded-full border border-outline flex items-center justify-center group-hover:border-primary transition-colors">
<input checked="" class="peer sr-only" name="theme" type="radio" value="light"/>
<div class="w-3 h-3 bg-primary rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-on-background">Light</span>
</label>
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative w-5 h-5 rounded-full border border-outline flex items-center justify-center group-hover:border-primary transition-colors">
<input class="peer sr-only" name="theme" type="radio" value="dark"/>
<div class="w-3 h-3 bg-primary rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-on-background">Dark</span>
</label>
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative w-5 h-5 rounded-full border border-outline flex items-center justify-center group-hover:border-primary transition-colors">
<input class="peer sr-only" name="theme" type="radio" value="sepia"/>
<div class="w-3 h-3 bg-primary rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-on-background">Sepia</span>
</label>
</div>
</section>
<!-- Divider -->
<hr class="border-t border-outline my-sm w-full"/>
<!-- Section: System Health -->
<section class="flex flex-col gap-md">
<div class="flex justify-between items-end">
<h2 class="font-headline-md text-headline-md text-on-surface">System Health</h2>
<span class="font-label-sm text-label-sm text-success flex items-center gap-unit">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
                        Healthy
                    </span>
</div>
<div class="flex justify-between items-center py-sm border-b border-outline">
<div>
<span class="font-body-md text-on-background block">Database Capacity</span>
<span class="font-label-sm text-label-sm text-secondary">Currently at 42%</span>
</div>
<!-- Pill Button -->
<button class="bg-primary text-on-primary rounded-full px-md py-sm font-body-md text-body-md hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2">
                        Optimize Database
                    </button>
</div>
<div class="flex justify-between items-center py-sm border-b border-outline">
<div>
<span class="font-body-md text-on-background block">Sync Status</span>
<span class="font-label-sm text-label-sm text-secondary">Last synced 2m ago</span>
</div>
<button class="text-primary font-body-md text-body-md flex items-center gap-unit hover:underline decoration-1 underline-offset-4">
<span class="material-symbols-outlined text-[18px]">sync</span>
                        Force Sync
                    </button>
</div>
</section>
<!-- Section: Danger Zone -->
<section class="flex flex-col gap-md mt-lg">
<h2 class="font-headline-md text-headline-md text-danger">Danger Zone</h2>
<div class="py-sm border-b border-outline">
<button class="text-danger font-body-md text-body-md flex items-center gap-unit hover:underline decoration-1 underline-offset-4 w-full justify-start text-left">
<span class="material-symbols-outlined text-[18px]">delete</span>
                        Delete Account Data
                    </button>
</div>
</section>
</main>
<!-- BottomNavBar (Settings is not a primary tab, but per prompt instructions to include it, we will render it. However, semantic logic dictates none of these are 'Settings', so none should strictly be active. If forced, we'll leave them all inactive to signify we are 'off-menu' or default to visually showing the shell without highlighting a specific mismatched tab.) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-margin-mobile border-t border-outline dark:border-outline-strong bg-surface-container dark:bg-inverse-surface z-50 md:hidden max-w-[600px] mx-auto left-1/2 -translate-x-1/2 shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform rounded-xl" href="#">
<span class="material-symbols-outlined">task_alt</span>
<span class="font-label-sm text-label-sm mt-1">My Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform rounded-xl" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label-sm text-label-sm mt-1">Team Board</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform rounded-xl" href="#">
<span class="material-symbols-outlined">folder</span>
<span class="font-label-sm text-label-sm mt-1">Projects</span>
</a>
</nav>
</div>
</body></html>
